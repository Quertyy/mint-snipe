[package]
name = "mint-sniper"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chrono = "0.4.23"
clap = { version = "4.1.4", features = ["derive", "cargo"] }
colored = "2.0.0"
dotenv = "0.15.0"
env_logger = "0.10.0"
ethabi = "18.0.0"
ethers = { version = "1.0.2", features = ["abigen", "rustls"] }
ethers-core = "1.0.2"
ethers-middleware = "1.0.2"
ethers-signers = "1.0.2"
eyre = "0.6.8"
hex = "0.4.3"
hex-literal = "0.3.4"
serde = "1.0.152"
serde_json = "1.0.91"
tokio = "1.24.2"