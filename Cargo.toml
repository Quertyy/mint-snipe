[package]
name = "mint-sniper"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.1.4", features = ["derive", "cargo"] }
dotenv = "0.15.0"
env_logger = "0.10.0"
ethers = { version = "1.0.2", features = ["abigen", "rustls"] }
eyre = "0.6.8"
hex = "0.4.3"
hex-literal = "0.3.4"
reqwest = "0.11.14"
serde_json = "1.0.91"
tokio = "1.24.2"
